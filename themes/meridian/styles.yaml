text:
  font: body
  size: 14
  color: dark1
  align: left
  valign: top
  insets: [0, 0, 0, 0]
  levels:
    1: { bullet: ■, bullet_color: accent1, bullet_size: 0.7, indent: 18, space_before: 8 }
    2: { bullet: –, bullet_color: muted, size: 13, indent: 36, space_before: 4 }

shape_text: { align: center, valign: middle }

picture: { fit: contain }

shape: { fill: light2, stroke: none }

line: { stroke: { color: dark1, width: 0.5 } }

styles:
  title: { size: 24, bold: true, valign: bottom }
  display: { size: 34, bold: true, valign: bottom }
  subtitle: { size: 14, bold: true, color: accent2 }
  kicker: { size: 12, bold: true, color: accent2 }
  cover_subtitle: { size: 16, color: muted }
  heading: { size: 14, bold: true, color: accent1 }
  lead: { bold: true, space_after: 4 }
  caption: { size: 9, color: muted }
  source: { size: 9, color: muted }
  emphasis: { bold: true, color: accent1 }

tables:
  financial:
    header: { bold: true, color: accent1, valign: bottom, border_bottom: { color: dark1, width: 0.75 } }
    total: { bold: true, fill: accent2 lighter 85, border_top: { color: dark1, width: 0.5 } }
    indent: 12

chart:
  series_colors: [accent1, accent2, accent3, accent4, accent5, accent6]
  text: { size: 11, color: dark1 }
  gap_width: 60
  value_axis: { visible: false, gridlines: false }
  legend: bottom

charts:
  segments:
    data_labels: { show: value, color: light1 }

formats:
  millions_of_dollars: { decimals: 0, separator: true, negative: parentheses }
  billions_of_dollars: { scale: 0.001, decimals: 1, prefix: "$", suffix: B, negative: parentheses }
  billions: { decimals: 1, prefix: "$", suffix: B, negative: parentheses }
  percent: { scale: 100, decimals: 0, suffix: "%", negative: minus }