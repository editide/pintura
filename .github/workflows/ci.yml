name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A hung test fails with its name rather than holding the job until it times out.
      - run: dotnet test src/Pintura.Tests --blame-hang-timeout 3m --logger "console;verbosity=normal"
      # The blame's sequence names the tests running when one hung, and the dump shows where.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: src/Pintura.Tests/TestResults
          retention-days: 7
      - run: node --test src/Pintura.Tests/*.js
      # Linux runners lack Arial, which the Meridian and Default fixture themes use.
      - if: runner.os == 'Linux'
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -q && sudo apt-get install -y -q ttf-mscorefonts-installer
      - name: Publish and smoke-test trimmed Linux release
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/Pintura --configuration Release --runtime linux-x64 --self-contained -p:DebugType=none -p:PublishTrimmed=true --output out/pintura
          out/pintura/Pintura --version
          smoke="$(mktemp -d)"
          out/pintura/Pintura --new "$smoke/deck"
          out/pintura/Pintura "$smoke/deck" --list
          out/pintura/Pintura "$smoke/deck" --check
      - name: Check every presentation
        run: |
          for presentation in presentations/*/; do
            dotnet run --project src/Pintura -- "$presentation" --check
          done